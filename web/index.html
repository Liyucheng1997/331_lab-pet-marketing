<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetOps Studio · 作图与上架</title>
<link rel="icon" type="image/png" href="/assets/petops-logo.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#gallery"><img src="/assets/petops-logo.png" alt=""><span>PetOps <b>Studio</b></span></a>
  <nav id="nav" aria-label="主导航"></nav>
  <div class="top-actions">
    <button id="tasks-button" class="ghost" onclick="toggleTasks()" aria-haspopup="true" aria-expanded="false">任务 <span id="task-count" class="count">0</span></button>
    <button class="ghost" onclick="go('settings')">设置</button>
  </div>
</header>
<aside id="tasks" class="drawer" aria-label="任务列表" hidden></aside>
<main id="app"></main>
<div id="lightbox" class="lightbox" hidden></div>
<dialog id="dialog"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
